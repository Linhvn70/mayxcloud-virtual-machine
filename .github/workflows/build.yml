name: Build installers
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Locate project (build.py or source ZIP)
        run: |
          F=$(find . -name build.py -not -path "./.git/*" -not -path "*/node_modules/*" | head -n1)
          if [ -z "$F" ]; then
            Z=$(find . -iname "*.zip" -not -path "./.git/*" | head -n1)
            [ -z "$Z" ] && { echo "ERROR: no build.py and no ZIP in repo"; ls -R | head -50; exit 1; }
            mkdir -p _src && unzip -q "$Z" -d _src
            F=$(find _src -name build.py | head -n1)
            [ -z "$F" ] && { echo "ERROR: no build.py inside $Z"; exit 1; }
          fi
          D=$(dirname "$F")
          echo "Project dir: $D"
          echo "MXVM_DIR=$D" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install Inno Setup and QEMU
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          choco install qemu -y --no-progress
          $q = "C:\Program Files\qemu"
          $dst = Join-Path $env:MXVM_DIR "installer\windows\qemu"
          if (Test-Path $q) { New-Item -ItemType Directory -Force $dst | Out-Null; Copy-Item "$q\*" $dst -Recurse -Force }
      - name: Build
        run: |
          cd "$MXVM_DIR"
          python build.py --windows
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: ${{ env.MXVM_DIR }}/release/*_Setup.exe
          if-no-files-found: error

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Locate project (build.py or source ZIP)
        run: |
          F=$(find . -name build.py -not -path "./.git/*" | head -n1)
          if [ -z "$F" ]; then
            Z=$(find . -iname "*.zip" -not -path "./.git/*" | head -n1)
            [ -z "$Z" ] && { echo "ERROR: no build.py and no ZIP in repo"; ls -R | head -50; exit 1; }
            mkdir -p _src && unzip -q "$Z" -d _src
            F=$(find _src -name build.py | head -n1)
            [ -z "$F" ] && { echo "ERROR: no build.py inside $Z"; exit 1; }
          fi
          D=$(dirname "$F")
          echo "Project dir: $D"
          echo "MXVM_DIR=$D" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: System packages and appimagetool
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev fakeroot libfuse2 wget libgl1 libxcb-cursor0 libxkbcommon-x11-0
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          echo "APPIMAGETOOL=$PWD/appimagetool" >> "$GITHUB_ENV"
      - name: Build
        run: |
          cd "$MXVM_DIR"
          python build.py --linux
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            ${{ env.MXVM_DIR }}/release/*.AppImage
            ${{ env.MXVM_DIR }}/release/*.deb
          if-no-files-found: error
